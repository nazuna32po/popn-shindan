    {name: "スペース＠マコ", gender: "女", personality: "正義感が強い・元気", personalityType: "A：明朗・活発型", age: "青年〜成人", look: "宇宙ヒロイン・SFスーツ", species: "人間/宇宙ヒロイン", color: "赤/白/青", tempo: "速め", music: "スペース・ポップ・SF", note: "Space Heroine系キャラクター。", wiki: "", score: 0},
    {name: "流星ハニー", gender: "女", personality: "元気・情熱的・ヒロイン気質", personalityType: "A：明朗・活発型", age: "青年〜成人", look: "流星・宇宙ヒロイン風", species: "宇宙人/宇宙ヒロイン", color: "黄/赤/ピンク", tempo: "速め", music: "ハッピー・宇宙・ポップ", note: "星・流星をモチーフにした宇宙系ヒロイン。", wiki: "", score: 0}
];

let filteredCharacters = [...characters];

// 質問リスト（全7問構成）
const questions = [
    {
        question: "Q1. キャラクターの種族は？",
        options: [
            { text: "人間キャラクター", filterType: "人間", weight: 3 },
            { text: "人間以外（人外・ロボット・動物・神など）", filterType: "人外", weight: 3 },
            { text: "こだわりなし（どちらでも）", filterType: "全員", weight: 0 }
        ]
    },
    {
        question: "Q2. キャラクターの性別は？",
        options: [
            { text: "男性", genderType: "男", weight: 3 },
            { text: "女性", genderType: "女", weight: 3 },
            { text: "無性別・不明など（不明）", genderType: "不明", weight: 3 },
            { text: "こだわりなし（気にしない）", genderType: "全員", weight: 0 }
        ]
    },
    {
        question: "Q3. キャラクターの年齢層（世代）の好みは？",
        options: [
            { text: "子供・児童（元気いっぱい系）", key: "age", value: "子供", weight: 3 },
            { text: "10代（学生・フレッシュ系）", key: "age", value: "10代", weight: 3 },
            { text: "若者（お兄さん・お姉さん系）", key: "age", value: "若者", weight: 3 },
            { text: "成人・大人の魅力（ベテラン・神など）", key: "age", value: "成人", weight: 3 }
        ]
    },
    {
        question: "Q4. どんな見た目・テイストが好き？",
        options: [
            { text: "とにかくかわいい系", key: "look", value: "かわいい", weight: 3 },
            { text: "かっこいい・スタイリッシュ系", key: "look", value: "かっこいい", weight: 3 },
            { text: "和風・エスニック系", key: "look", value: "和風", weight: 3 },
            { text: "個性的・コミカル系", key: "look", value: "コミカル", weight: 3 }
        ]
    },
    {
        question: "Q5. どんな性格タイプに一番惹かれる？（最重要）",
        options: [
            { text: "✨ A：明朗・活発型（明るい、元気、活発、おしゃべりなど）", personalityType: "A", weight: 5 },
            { text: "🍃 B：穏やか・自由型（優しい、マイペース、おっとり、飄々など）", personalityType: "B", weight: 5 },
            { text: "🌙 C：冷静・知性型（クール、真面目、知的、寡黙など）", personalityType: "C", weight: 5 },
            { text: "🔥 D：強気・個性型（豪快、勝ち気、熱血、コミカルなど）", personalityType: "D", weight: 5 }
        ]
    },
    {
        question: "Q6. 好きな曲のテンポ（スピード感）は？",
        options: [
            { text: "アップテンポで速い・ノリノリ！", key: "tempo", value: "速め", weight: 2 },
            { text: "程よいミディアムテンポ（普通）", key: "tempo", value: "普通", weight: 2 },
            { text: "ゆったり・スローテンポ（遅め）", key: "tempo", value: "遅め", weight: 2 }
        ]
    },
    {
        question: "Q7. 好きな音楽のジャンル・雰囲気は？",
        options: [
            { text: "ポップス・アイドル・ダンス系", key: "music", value: "ポップ", weight: 3 },
            { text: "ロック・パンク・メタル系", key: "music", value: "ロック", weight: 3 },
            { text: "和風・エスニック・民族系", key: "music", value: "和風", weight: 3 },
            { text: "ジャズ・ラテン・ファンタジー・テクノ系", key: "music", value: "ジャズ", weight: 3 }
        ]
    }
];

let currentQ = 0;

function showQuestion() {
    const q = questions[currentQ];
    document.getElementById("progress").innerText = `質問 ${currentQ + 1} / ${questions.length}`;
    document.getElementById("question-text").innerText = q.question;
    const optsDiv = document.getElementById("options-container");
    optsDiv.innerHTML = "";

    q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt);
        optsDiv.appendChild(btn);
    });
}

function selectOption(opt) {
    const weight = opt.weight || 2;

    // Q1: 種族の絞り込み
    if (currentQ === 0) {
        if (opt.filterType === "人間") {
            filteredCharacters = characters.filter(c => c.species === "人間" || c.species.includes("人間"));
        } else if (opt.filterType === "人外") {
            filteredCharacters = characters.filter(c => c.species !== "人間" && !c.species.startsWith("人間"));
        } else {
            filteredCharacters = [...characters];
        }
    }
    // Q2: 性別の絞り込み
    else if (currentQ === 1) {
        if (opt.genderType === "男") {
            filteredCharacters = filteredCharacters.filter(c => c.gender === "男");
        } else if (opt.genderType === "女") {
            filteredCharacters = filteredCharacters.filter(c => c.gender === "女");
        } else if (opt.genderType === "不明") {
            filteredCharacters = filteredCharacters.filter(c => c.gender === "不明" || (c.gender !== "男" && c.gender !== "女"));
        }
    }
    // Q5 (index 4): 性格タイプ（重い比重で加点）
    else if (currentQ === 4 && opt.personalityType) {
        filteredCharacters.forEach(c => {
            if (c.personalityType && c.personalityType.startsWith(opt.personalityType)) {
                c.score += weight; // weight = 5
            }
        });
    }
    // その他の質問加点
    else {
        filteredCharacters.forEach(c => {
            if (currentQ === 6 && opt.text.includes("ジャズ・ラテン")) {
                if (c.music.includes("ジャズ") || c.music.includes("ラテン") || c.music.includes("ファンタジー") || c.music.includes("テクノ") || c.music.includes("幻想") || c.music.includes("クラシック") || c.music.includes("アンビエント") || c.music.includes("ダンス") || c.music.includes("ディスコ") || c.music.includes("シャンソン")) {
                    c.score += weight;
                }
            } 
            else {
                if (opt.key && c[opt.key] && c[opt.key].includes(opt.value)) {
                    c.score += weight;
                }
            }
        });
    }

    currentQ++;
    if (currentQ < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("progress").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");

    filteredCharacters.sort((a, b) => b.score - a.score);

    const listDiv = document.getElementById("result-list");
    listDiv.innerHTML = "";

    const topResults = filteredCharacters.slice(0, 10);

    if (topResults.length === 0) {
        listDiv.innerHTML = "<p style='text-align:center;'>条件に合うキャラクターが見つかりませんでした。</p>";
        return;
    }

    topResults.forEach((c, index) => {
        const card = document.createElement("div");
        card.className = "card";
        
        let wikiBtn = "";
        if (c.wiki) {
            wikiBtn = `<br><a href="${c.wiki}" target="_blank" rel="noopener" class="wiki-link">📖 Fandom Wikiで詳しく見る</a>`;
        }

        card.innerHTML = `
            <h3>${index + 1}位：${c.name} (${c.gender} / 年齢:${c.age})</h3>
            <p>
                <span class="tag">タイプ:${c.personalityType || '未指定'}</span>
                <span class="tag">種族:${c.species}</span>
                <span class="tag">性格:${c.personality}</span>
                <span class="tag">見た目:${c.look}</span>
                <span class="tag">曲調:${c.music}</span>
            </p>
            <p><strong>特徴：</strong> ${c.note}</p>
            ${wikiBtn}
        `;
        listDiv.appendChild(card);
    });
}

window.onload = function() {
    showQuestion();
};
</script>
