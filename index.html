    const optsDiv = document.getElementById("options-container");

        btn.className = "btn";
        btn.innerText = opt.text;

            filteredCharacters = filteredCharacters.filter(c => c.gender === "女" || c.gender.includes("女"));
        } else if (opt.genderType === "不明") {
            filteredCharacters = filteredCharacters.filter(c => c.gender === "不明" || (!c.gender.includes("男") && !c.gender.includes("女")));
        }
    }
    // Q3: 年齢判定
    else if (currentQ === 2 && opt.ageType) {
        filteredCharacters.forEach(c => {
            if (opt.ageType === "若者・青年") {
                if (c.age.includes("若者") || c.age.includes("青年") || c.age.includes("10代")) {
                    c.score += weight;
                }
            } else if (c.age.includes(opt.ageType) || c.age === "不明" || c.age.includes("相当")) {
                c.score += weight;
            }
        });
    }
    // Q4: アイドル・ゴシック等 見た目判定
    else if (currentQ === 3) {
        if (opt.idolLook) {
            filteredCharacters.forEach(c => {
                if (c.look.includes("アイドル") || c.look.includes("王子") || c.look.includes("スタイリッシュ") || c.look.includes("華やか")) {
                    c.score += 4;
                }
            });
        } else if (opt.gothicDressLook) {
            filteredCharacters.forEach(c => {
                if (c.look.includes("ゴシック") || c.look.includes("ドレス") || c.species.includes("アンデッド") || c.species.includes("幽霊")) {
                    c.score += 4;
                } else if (c.look.includes("神秘")) {
                    c.score += 2;
                }
            });
        } else if (opt.key) {
            filteredCharacters.forEach(c => {
                if (c[opt.key] && (c[opt.key].includes(opt.value) || (opt.value === "かっこいい" && (c[opt.key].includes("クール") || c[opt.key].includes("スタイリッシュ"))) || (opt.value === "コミカル" && (c[opt.key].includes("列車") || c[opt.key].includes("ロボット") || c[opt.key].includes("ドレッド") || c[opt.key].includes("奇抜") || c[opt.key].includes("モチーフ"))))) {
                    c.score += weight;
                }
            });
        }
    }
    // Q5: 性格タイプ判定
    else if (currentQ === 4 && opt.personalityType) {
        filteredCharacters.forEach(c => {
            if (c.personalityType && c.personalityType.startsWith(opt.personalityType)) {
                c.score += weight;
            }
        });
    }
    // Q7: 音楽ジャンル判定
    else if (currentQ === 6) {
        if (opt.idolMusic) {
            filteredCharacters.forEach(c => {
                if (c.music.includes("ポップ") || c.music.includes("アイドル") || c.music.includes("J-ロック") || c.look.includes("アイドル")) {
                    c.score += 4;
                }
            });
        } else if (opt.gothicMusic) {
            filteredCharacters.forEach(c => {
                if (c.music.includes("ゴシック") || c.music.includes("メランコリック")) {
                    c.score += 4;
                } else if (c.music.includes("ダーク") || c.music.includes("クラシック") || c.music.includes("ミスティ") || c.music.includes("エモ")) {
                    c.score += 2;
                }
            });
        } else if (opt.key) {
            filteredCharacters.forEach(c => {
                if (c[opt.key] && (c[opt.key].includes(opt.value) || (opt.value === "ジャズ" && (c[opt.key].includes("テクノ") || c[opt.key].includes("鉄道") || c[opt.key].includes("ラウドビーチ") || c[opt.key].includes("ビーチ"))))) {
                    c.score += weight;
                }
            });
        }
    }
    // Q8: 世界観判定
    else if (currentQ === 7) {
        if (opt.darkGothicWorld) {
            filteredCharacters.forEach(c => {
                if (c.music.includes("ゴシック") || c.music.includes("メランコリック") || c.species.includes("アンデッド")) {
                    c.score += 6;
                } else if (c.personalityType.startsWith("C") || c.personalityType.startsWith("D")) {
                    c.score += 3;
                }
            });
        } else if (opt.personalityType) {
            filteredCharacters.forEach(c => {
                if (c.personalityType && c.personalityType.startsWith(opt.personalityType)) {
                    c.score += weight;
                }
            });
        }
    }
    // その他の属性加点
    else {
        filteredCharacters.forEach(c => {
            if (opt.key && c[opt.key] && c[opt.key].includes(opt.value)) {
                c.score += weight;
            }
        });
    }

    currentQ++;
    if (currentQ < questions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("progress").classList.add("hidden");
    document.getElementById("result-screen").classList.remove("hidden");

    filteredCharacters.sort((a, b) => b.score - a.score);

    const listDiv = document.getElementById("result-list");
    listDiv.innerHTML = "";

    const topResults = filteredCharacters.slice(0, 10);

    if (topResults.length === 0) {
        listDiv.innerHTML = "<p style='text-align:center;'>条件に合うキャラクターが見つかりませんでした。</p>";
        return;
    }

    topResults.forEach((c, index) => {
        const card = document.createElement("div");
        card.className = "card";
        
        let wikiBtn = "";
        if (c.wiki) {
            wikiBtn = `<br><a href="${c.wiki}" target="_blank" rel="noopener" class="wiki-link">📖 Fandom Wikiで詳しく見る</a>`;
        }

        card.innerHTML = `
            <h3>${index + 1}位：${c.name} (${c.gender} / 年齢:${c.age})</h3>
            <p>
                <span class="tag">タイプ:${c.personalityType || '未指定'}</span>
                <span class="tag">種族:${c.species}</span>
                <span class="tag">性格:${c.personality}</span>
                <span class="tag">見た目:${c.look}</span>
                <span class="tag">曲調:${c.music}</span>
            </p>
            <p><strong>特徴：</strong> ${c.note}</p>
            ${wikiBtn}
        `;
        listDiv.appendChild(card);
    });
}

window.onload = function() {
    showQuestion();
};
</script>
